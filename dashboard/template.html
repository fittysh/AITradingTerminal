<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Trading Terminal</title>
<meta name="description" content="v4 sweep-reversal trading dashboard — Bitget USDT-M, DEMO by default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a1a19'/%3E%3Cpath d='M10 7v18M22 5v20' stroke='%23898781' stroke-width='2'/%3E%3Crect x='7' y='11' width='6' height='9' rx='1' fill='%23d03b3b'/%3E%3Crect x='19' y='9' width='6' height='11' rx='1' fill='none' stroke='%230ca30c' stroke-width='2'/%3E%3C/svg%3E">
<style>
/* Tokens: the dataviz reference palette (validated). Light is the base; dark is selected, not flipped. */
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --hover: rgba(11,11,11,0.045); --press: rgba(11,11,11,0.08);
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --accent: #2a78d6; --accent-wash: rgba(42,120,214,0.10); --accent-track: #cde2fb;
  --pos: #0ca30c; --neg: #d03b3b; --warn: #fab219; --serious: #ec835a;
  --pos-text: #006300; --neg-text: #d03b3b; --mid: #f0efec;
  --f1: #86b6ef; --f2: #5598e7; --f3: #2a78d6; --f4: #1c5cab; --f5: #0d366b;
  --shadow: 0 1px 2px rgba(11,11,11,0.05), 0 4px 16px rgba(11,11,11,0.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --hover: rgba(255,255,255,0.05); --press: rgba(255,255,255,0.09);
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --accent: #3987e5; --accent-wash: rgba(57,135,229,0.13); --accent-track: #0d366b;
    --pos-text: #0ca30c; --neg-text: #e66767; --mid: #383835;
    --f1: #184f95; --f2: #3987e5; --f3: #6da7ec; --f4: #9ec5f4; --f5: #cde2fb;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --hover: rgba(255,255,255,0.05); --press: rgba(255,255,255,0.09);
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --accent: #3987e5; --accent-wash: rgba(57,135,229,0.13); --accent-track: #0d366b;
  --pos-text: #0ca30c; --neg-text: #e66767; --mid: #383835;
  --f1: #184f95; --f2: #3987e5; --f3: #6da7ec; --f4: #9ec5f4; --f5: #cde2fb;
  --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink); }
body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
a { color: var(--accent); }
.num, table, .tick { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1440px; margin: 0 auto; padding: 0 20px 40px; }

/* header */
.top { position: sticky; top: 0; z-index: 20; background: var(--page); border-bottom: 1px solid var(--border); }
.top-in { max-width: 1440px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: none; }
.brand-name { font-weight: 700; letter-spacing: .08em; font-size: 13px; }
.brand-sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--ink-2); font-size: 12.5px; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border);
  font-weight: 650; font-size: 11.5px; letter-spacing: .05em; color: var(--ink); background: var(--surface); }
.badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.badge.paper .dot, .badge.demo .dot { background: var(--accent); }
.badge.live { border-color: var(--neg); } .badge.live .dot { background: var(--neg); }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; margin-right: 5px; }
.live-dot.on { background: var(--pos); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pos) 25%, transparent); }
.iconbtn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 4px 9px; cursor: pointer; }
.iconbtn:hover { background: var(--hover); }

/* hero + tiles */
.hero { display: grid; grid-template-columns: minmax(260px, 1.2fr) 3fr; gap: 16px; margin: 18px 0 14px; align-items: stretch; }
.hero-main { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; justify-content: space-between; }
.hero-label { color: var(--ink-2); font-size: 12.5px; }
.hero-fig { font-size: 48px; font-weight: 650; letter-spacing: -.01em; line-height: 1.05; margin: 4px 0 2px; }
.hero-meta { color: var(--ink-2); font-size: 12.5px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); min-width: 0; }
.tile-label { color: var(--ink-2); font-size: 12px; }
.tile-value { font-size: 22px; font-weight: 650; margin-top: 2px; white-space: nowrap; }
.tile-meta { color: var(--muted); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.up { color: var(--pos-text); } .down { color: var(--neg-text); }

/* risk shell */
.shell { display: grid; grid-template-columns: 1.1fr 1.4fr 1fr 1.4fr 1.2fr; gap: 18px; align-items: center; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }
.shell-item .k { color: var(--ink-2); font-size: 12px; display: flex; justify-content: space-between; gap: 8px; }
.shell-item .v { font-weight: 650; font-size: 13.5px; margin-top: 2px; }
.meter { height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--accent) 16%, var(--surface)); margin-top: 7px; overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.pips { display: flex; gap: 4px; margin-top: 7px; }
.pip { width: 14px; height: 10px; border-radius: 3px; border: 1.5px solid var(--axis); }
.pip.neg { background: var(--neg); border-color: var(--neg); }
.pip.on { background: var(--accent); border-color: var(--accent); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-weight: 600; font-size: 12.5px; border: 1px solid var(--border); background: var(--surface); white-space: nowrap; }
.chip.good { border-color: color-mix(in srgb, var(--pos) 55%, transparent); }
.chip.bad { border-color: color-mix(in srgb, var(--neg) 70%, transparent); }
.chip .ic { font-size: 13px; }
.chip.good .ic { color: var(--pos-text); } .chip.bad .ic { color: var(--neg-text); }

/* tabs */
.tabs { display: flex; gap: 2px; margin: 18px 0 14px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tab { border: 0; background: none; padding: 9px 14px; cursor: pointer; color: var(--ink-2); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab:hover { color: var(--ink); background: var(--hover); border-radius: 8px 8px 0 0; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .n { color: var(--muted); font-weight: 500; margin-left: 4px; }

/* layout */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.s12 { grid-column: span 12; } .s8 { grid-column: span 8; } .s7 { grid-column: span 7; } .s6 { grid-column: span 6; } .s5 { grid-column: span 5; } .s4 { grid-column: span 4; }
.card-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.card-t { font-weight: 650; font-size: 14px; }
.card-s { color: var(--muted); font-size: 12px; }
.card-h .spacer { flex: 1; }
.tbtn { border: 1px solid var(--border); background: none; border-radius: 7px; padding: 2px 8px; font-size: 12px; color: var(--ink-2); cursor: pointer; }
.tbtn:hover { background: var(--hover); } .tbtn[aria-pressed="true"] { background: var(--press); color: var(--ink); }
.chart { position: relative; width: 100%; }
.chart svg { display: block; overflow: visible; }
.chart svg:focus { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.empty { color: var(--muted); padding: 22px 6px; text-align: center; font-size: 13px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.fbtn { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 12.5px; color: var(--ink-2); }
.fbtn:hover { background: var(--hover); }
.fbtn[aria-pressed="true"] { color: var(--ink); border-color: var(--accent); font-weight: 650; }
.fnote { color: var(--muted); font-size: 12px; margin-left: 6px; }

/* tables */
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th { text-align: left; color: var(--ink-2); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--axis); white-space: nowrap; position: sticky; top: 0; background: var(--surface); }
td { padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
td.r, th.r { text-align: right; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--hover); }
tr.sel td { background: var(--accent-wash); }
.sym { font-weight: 650; }
.muted { color: var(--muted); } .ink2 { color: var(--ink-2); }
.dir { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--border); }
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; }
.st .g { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.st.signal .g { background: var(--accent); }
.st.in-zone .g { border: 2px solid var(--accent); }
.st.armed .g { border: 2px dashed var(--muted); }
.pd { font-size: 11.5px; font-weight: 600; }
.pd.broken::before { content: "▲ "; } .pd.swept::before { content: "↺ "; } .pd.respected::before { content: "· "; }
.pd.respected { color: var(--muted); }
.scroll { max-height: 440px; overflow: auto; }

/* positions */
.pos { padding: 10px 0 12px; border-bottom: 1px solid var(--grid); }
.pos:last-child { border-bottom: 0; }
.pos-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pos-h .rv { margin-left: auto; text-align: right; }
.pos-h .rv b { font-size: 16px; }
.pos-f { color: var(--ink-2); font-size: 12px; margin-top: 2px; }

/* signals */
.split { display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); gap: 16px; align-items: start; }
.check { list-style: none; margin: 0; padding: 0; }
.check li { display: grid; grid-template-columns: 26px 1fr; gap: 6px; padding: 7px 0; border-bottom: 1px solid var(--grid); }
.check li:last-child { border-bottom: 0; }
.check .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; font-weight: 700; border: 1.5px solid var(--axis); color: var(--ink-2); }
.check .ok .n { border-color: var(--pos); color: var(--pos-text); }
.check .wait .n { border-style: dashed; }
.check .nm { font-weight: 650; font-size: 13px; }
.check .dt { color: var(--ink-2); font-size: 12.5px; }
.plan { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin: 10px 0 4px; }
.plan > div { border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; }
.plan .k { color: var(--muted); font-size: 11.5px; } .plan .v { font-weight: 650; }
.keyline { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 5px; }

/* timeline + journal */
.feed { list-style: none; margin: 0; padding: 0; }
.feed li { display: grid; grid-template-columns: 46px 18px 1fr; gap: 6px; padding: 5px 0; border-bottom: 1px solid var(--grid); font-size: 12.5px; }
.feed li:last-child { border-bottom: 0; }
.feed .t { color: var(--muted); } .feed .ic { text-align: center; }
.md h2 { font-size: 18px; margin: 0 0 6px; } .md h3 { font-size: 15px; margin: 18px 0 6px; } .md h4 { font-size: 13.5px; margin: 14px 0 4px; }
.md p { margin: 4px 0; color: var(--ink-2); } .md ul, .md ol { margin: 4px 0 4px 18px; padding: 0; color: var(--ink-2); }
.md table { margin: 6px 0 10px; } .md code { font-size: 12px; background: var(--hover); padding: 1px 4px; border-radius: 4px; }
.days { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.sched { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 12px; font-size: 12.5px; }
.sched .ok { color: var(--pos-text); } .sched .bad { color: var(--neg-text); }

/* tooltip */
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--border);
  border-radius: 9px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 6px 24px rgba(0,0,0,0.18); min-width: 120px; max-width: 280px; }
.tip .tt { color: var(--muted); font-size: 11.5px; margin-bottom: 4px; }
.tip .row { display: flex; align-items: center; gap: 8px; }
.tip .row b { font-size: 13px; }
.tip .row span { color: var(--ink-2); }
footer { color: var(--muted); font-size: 12px; margin-top: 26px; display: flex; gap: 14px; flex-wrap: wrap; }

@media (max-width: 1100px) {
  .shell { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .s8, .s7, .s6, .s5, .s4 { grid-column: span 12; }
  .split { grid-template-columns: 1fr; }
}
@media (max-width: 720px) {
  .wrap { padding: 0 16px 32px; } .top-in { padding: 10px 16px; }
  .hero { grid-template-columns: 1fr; }
  .hero-fig { font-size: 40px; }
  .shell { grid-template-columns: 1fr; gap: 14px; }
  .brand-sub { display: none; }
  .top { position: static; }
}
@media (prefers-reduced-motion: no-preference) { .live-dot.on { transition: box-shadow .4s; } }
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#1a1a19"/><path d="M10 7v18M22 5v20" stroke="#898781" stroke-width="2"/><rect x="7" y="11" width="6" height="9" rx="1" fill="#d03b3b"/><rect x="19" y="9" width="6" height="11" rx="1" fill="none" stroke="#0ca30c" stroke-width="2"/></svg>
    <div><div class="brand-name">AI TRADING TERMINAL</div><div class="brand-sub" id="brand-sub"></div></div>
  </div>
  <div class="top-right">
    <span id="mode" class="badge"></span>
    <span id="live"><span class="live-dot"></span><span></span></span>
    <span id="clock" class="num"></span>
    <button id="theme" class="iconbtn" type="button" title="Theme: auto / light / dark">◐ Auto</button>
  </div>
</div></header>
<div class="wrap">
  <section id="hero" class="hero" aria-label="Account"></section>
  <section id="shell" class="card shell" aria-label="Protection shell"></section>
  <nav id="tabs" class="tabs" role="tablist" aria-label="Views"></nav>
  <main id="view"></main>
  <footer id="foot"></footer>
</div>
<div id="tip" class="tip" role="tooltip" hidden></div>
<script id="state" type="application/json">/*__STATE__*/null</script>
<script>
(() => {
'use strict';
let S = null;
try { S = JSON.parse(document.getElementById('state').textContent); } catch (e) { S = null; }
const UI = { tab: 'overview', sel: null, sigFilter: 'all', range: 'all', day: null, table: {} };
const store = {
  get(k) { try { return localStorage.getItem('att.' + k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('att.' + k, v); } catch (e) { /* private mode */ } },
};
UI.tab = store.get('tab') || 'overview';
const SERVED = location.protocol.startsWith('http');
let lastPollOk = SERVED ? true : null;
let observers = [];

/* ---------- DOM helpers (data always via textContent) ---------- */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const NS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs, text) {
  const el = document.createElementNS(NS, tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) if (v != null) el.setAttribute(k, v);
  if (text != null) el.textContent = text;
  return el;
}
const clear = el => { while (el.firstChild) el.removeChild(el.firstChild); return el; };

/* ---------- formatting (MYT = UTC+8, no DST) ---------- */
const pad = n => String(n).padStart(2, '0');
function parts(ts) { const d = new Date(ts + 8 * 3600e3); return { y: d.getUTCFullYear(), m: pad(d.getUTCMonth() + 1), d: pad(d.getUTCDate()), H: pad(d.getUTCHours()), M: pad(d.getUTCMinutes()), S: pad(d.getUTCSeconds()) }; }
const fTs = ts => { if (!ts) return '—'; const t = parts(ts); return `${t.y}-${t.m}-${t.d} ${t.H}:${t.M}`; };
const fShort = ts => { if (!ts) return '—'; const t = parts(ts); return `${t.m}-${t.d} ${t.H}:${t.M}`; };
const fHM = ts => { if (!ts) return '—'; const t = parts(ts); return `${t.H}:${t.M}`; };
function px(x) {
  if (x == null || !isFinite(x)) return '—';
  const a = Math.abs(x);
  if (a >= 1000) return x.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  if (a >= 1) return x.toFixed(4);
  if (a === 0) return '0';
  const d = Math.min(10, Math.max(4, -Math.floor(Math.log10(a)) + 3));
  return x.toFixed(d);
}
const MINUS = '−';
function usd(x, signed = false, dp = 2) {
  if (x == null || !isFinite(x)) return '—';
  const v = Math.abs(x).toLocaleString('en-US', { minimumFractionDigits: dp, maximumFractionDigits: dp });
  if (signed) return (x > 0 ? '+' : x < 0 ? MINUS : '') + '$' + v;
  return (x < 0 ? MINUS : '') + '$' + v;
}
function pct(x, dp = 2, signed = true) {
  if (x == null || !isFinite(x)) return '—';
  const v = (Math.abs(x) * 100).toFixed(dp) + '%';
  return signed ? (x > 0 ? '+' : x < 0 ? MINUS : '') + v : (x < 0 ? MINUS : '') + v;
}
function R(x, dp = 2) { if (x == null || !isFinite(x)) return '—'; return (x > 0 ? '+' : x < 0 ? MINUS : '') + Math.abs(x).toFixed(dp) + 'R'; }
function compact(x) { if (x == null) return '—'; for (const [d, u] of [[1e9, 'B'], [1e6, 'M'], [1e3, 'K']]) if (Math.abs(x) >= d) return '$' + (x / d).toFixed(1) + u; return '$' + x.toFixed(0); }
function ago(ts, now) { if (!ts) return 'never'; const s = Math.max(0, (now - ts) / 1000); if (s < 90) return Math.round(s) + 's ago'; if (s < 5400) return Math.round(s / 60) + 'm ago'; if (s < 129600) return (s / 3600).toFixed(1) + 'h ago'; return (s / 86400).toFixed(1) + 'd ago'; }
function until(ts, now) { if (!ts) return '—'; const s = Math.max(0, (ts - now) / 1000); if (s < 90) return 'in ' + Math.round(s) + 's'; if (s < 5400) return 'in ' + Math.round(s / 60) + 'm'; return 'in ' + (s / 3600).toFixed(1) + 'h'; }
const cls = v => v > 0 ? 'up' : v < 0 ? 'down' : '';
const signed = (text, v) => h('span', { class: cls(v) }, text);
const nowMs = () => S && S.meta.sim ? S.meta.generated_at : Date.now();

/* ---------- tooltip ---------- */
const tip = document.getElementById('tip');
function showTip(ev, title, rows) {
  clear(tip);
  if (title) tip.append(h('div', { class: 'tt', text: title }));
  for (const r of rows) {
    const row = h('div', { class: 'row' });
    if (r.key) row.append(h('i', { class: 'keyline', style: `background:${r.key}` }));
    row.append(h('b', { text: r.value }));

/* Line chart: a single series (the title names it — no legend box), 2px line, 10% wash,

  return chartHost((host, W) => {
    if (points.length < 2) { host.append(h('div', { class: 'empty', text: opts.empty || 'No data yet.' })); return; }

    let lo = Math.min(...ys, opts.baseline ?? Infinity), hi = Math.max(...ys, opts.baseline ?? -Infinity);
    const padY = (hi - lo) * 0.08 || Math.abs(hi) * 0.01 || 1; lo -= padY; hi += padY;

      if (Math.abs(Y(tk) + 4 - endY) > 13) svg.append(sv('text', { x: W - m.r + 8, y: Y(tk) + 4, fill: 'var(--muted)', 'font-size': 11, class: 'tick' }, (opts.fmt || px)(tk)));
    }

    for (let i = 0; i < nT; i++) {
      const t = t0 + (t1 - t0) * i / (nT - 1);
      svg.append(sv('text', { x: X(t), y: H - 6, fill: 'var(--muted)', 'font-size': 11, 'text-anchor': i === 0 ? 'start' : i === nT - 1 ? 'end' : 'middle', class: 'tick' }, fShort(t)));
    }

      svg.append(sv('line', { x1: m.l, x2: W - m.r, y1: Y(opts.baseline), y2: Y(opts.baseline), stroke: 'var(--axis)', 'stroke-width': 1 }));
      svg.append(sv('text', { x: m.l + 4, y: Y(opts.baseline) - 5, fill: 'var(--muted)', 'font-size': 11 }, opts.baselineLabel || 'start'));
    }
    const d = points.map((p, i) => `${i ? 'L' : 'M'}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join('');
    svg.append(sv('path', { d: `${d}L${X(t1)},${H - m.b}L${X(t0)},${H - m.b}Z`, fill: 'var(--accent-wash)', stroke: 'none' }));
    svg.append(sv('path', { d, fill: 'none', stroke: 'var(--accent)', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
    const last = points[points.length - 1];
    svg.append(sv('circle', { cx: X(last[0]), cy: Y(last[1]), r: 4, fill: 'var(--accent)', stroke: 'var(--surface)', 'stroke-width': 2 }));
    svg.append(sv('text', { x: W - m.r + 8, y: Y(last[1]) - 8, fill: 'var(--ink)', 'font-size': 12, 'font-weight': 650, class: 'tick' }, (opts.fmt || px)(last[1])));
    const cross = sv('line', { y1: m.t, y2: H - m.b, stroke: 'var(--axis)', 'stroke-width': 1, visibility: 'hidden' });
    const dot = sv('circle', { r: 4, fill: 'var(--accent)', stroke: 'var(--surface)', 'stroke-width': 2, visibility: 'hidden' });

      dot.setAttribute('cx', X(p[0])); dot.setAttribute('cy', Y(p[1])); dot.setAttribute('visibility', 'visible');

/* The R-ladder of one open position: −1R stop → breakeven → +1R (TP1) → +2R (lock) → target. */

    const H = 50, lo = -1.2, hi = Math.max(p.r_target || 2, 2.2) + 0.2, l = 10, r = 10;
    const X = v => l + (W - l - r) * (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo);
    const y = 20;

    svg.append(sv('rect', { x: X(-1), y: y - 3, width: X(p.r_target) - X(-1), height: 6, rx: 3, fill: 'var(--grid)' }));

    for (const tk of niceTicks(lo, hi, 5)) {

    }
    const nT = Math.max(2, Math.min(6, Math.floor(plotW / 120)));
    for (let k = 0; k < nT; k++) {
      const i = Math.round((n - 1) * k / (nT - 1));
      svg.append(sv('text', { x: X(i), y: H - 6, fill: 'var(--muted)', 'font-size': 11, 'text-anchor': k === 0 ? 'start' : k === nT - 1 ? 'end' : 'middle', class: 'tick' }, fShort(c.t[i])));
    }

    svg.append(sv('text', { x: X(ex), y: ey + (long ? 12 : -10), fill: 'var(--ink-2)', 'font-size': 10.5, 'text-anchor': 'middle' }, s.raid.kind === 'raid' ? 'raid' : 'CISD'));
    // price levels with right-gutter labels (leader lines keep them attached when they crowd)
    const lines = [

      { v: s.entry, t: (s.status === 'signal' ? 'entry ' : 'plan ') + px(s.entry), c: 'var(--ink)', w: 1 },

    for (const L of lines) if (L.w) svg.append(sv('line', { x1: m.l, x2: W - m.r, y1: Y(L.v), y2: Y(L.v), stroke: L.c, 'stroke-width': L.w }));
    const placed = lines.map(L => ({ ...L, y: Y(L.v) })).sort((a, b) => a.y - b.y);
    for (let i = 1; i < placed.length; i++) if (placed[i].y - placed[i - 1].y < 14) placed[i].y = placed[i - 1].y + 14;
    for (const L of placed) {
      svg.append(sv('line', { x1: W - m.r, x2: W - m.r + 6, y1: Y(L.v), y2: L.y, stroke: L.c, 'stroke-width': 1 }));
      svg.append(sv('rect', { x: W - m.r + 7, y: L.y - 1, width: 8, height: 2, fill: L.c }));
      svg.append(sv('text', { x: W - m.r + 18, y: L.y + 4, fill: 'var(--ink)', 'font-size': 11, class: 'tick' }, L.t));
    }
    // crosshair
    const cross = sv('line', { y1: m.t, y2: H - m.b, stroke: 'var(--axis)', 'stroke-width': 1, visibility: 'hidden' });
    svg.append(cross);
    let idx = n - 1;
    const at = (i, ev) => {
      idx = Math.max(0, Math.min(n - 1, i));
      cross.setAttribute('x1', X(idx)); cross.setAttribute('x2', X(idx)); cross.setAttribute('visibility', 'visible');
      showTip(ev, fTs(c.t[idx]) + ' MYT · ' + s.struct_tf, [
        { value: px(c.o[idx]), label: 'open' }, { value: px(c.h[idx]), label: 'high' },
        { value: px(c.l[idx]), label: 'low' }, { value: px(c.c[idx]), label: 'close' }]);
    };
    svg.addEventListener('pointermove', ev => { const b = svg.getBoundingClientRect(); at(Math.floor((ev.clientX - b.left - m.l) / step), ev); });
    svg.addEventListener('pointerleave', () => { cross.setAttribute('visibility', 'hidden'); hideTip(); });
    svg.addEventListener('keydown', ev => {
      if (ev.key !== 'ArrowLeft' && ev.key !== 'ArrowRight') return;
      ev.preventDefault(); const b = svg.getBoundingClientRect(); const ni = idx + (ev.key === 'ArrowRight' ? 1 : -1);
      at(ni, { clientX: b.left + X(Math.max(0, Math.min(n - 1, ni))), clientY: b.top + 30 });

}

  if (s.chart) {

}

  wrap.append(tiles);

  g.append(card('Equity', 'net, every fill', () => lineChart(eq, { baseline: eq.length ? eq[0][1] : S.account.start, baselineLabel: UI.range === 'all' ? 'start' : 'range start', fmt: v => usd(v, false, 0), seriesName: 'equity', label: 'equity curve', height: 240, empty: 'No fills in this range.' }),
    { span: 's12', key: 'equity', table: () => table(['Time (MYT)', { t: 'Equity', r: 1 }], eq.slice(-300).reverse().map(p => ({ cells: [fTs(p[0]), usd(p[1])] }))) }));
  const daily = (S.daily || []).filter(d => { const dt = Date.parse(d[0] + 'T07:00:00+08:00'); return dt + 864e5 > t0; });
  const dItems = daily.map(d => ({ label: d[0], short: d[0].slice(5), value: d[1], title: `market day ${d[0]}`, sub: `${d[2]} trades closed` }));
  g.append(card('Daily net P&L', 'per market day (07:00 → 07:00 MYT)', () => columns(dItems, { fmt: v => usd(v, false, 0), fmtTip: v => usd(v, true), label: 'daily net P&L', empty: 'No realized P&L in this range.' }),
    { span: 's4', key: 'daily', table: () => table(['Market day', { t: 'Net', r: 1 }, { t: 'Trades', r: 1 }], daily.slice().reverse().map(d => ({ cells: [d[0], signed(usd(d[1], true), d[1]), String(d[2])] }))) }));
  const edges = [-Infinity, -1.0001, -0.5, 0, 0.5, 1, 1.5, 2, 3, Infinity];

  const hist = names.map((nm, i) => ({ label: nm, short: nm.replace('R', ''), value: trades.filter(t => t.r_mult > edges[i] && t.r_mult <= edges[i + 1]).length, color: i < 3 ? 'var(--neg)' : 'var(--pos)', sub: i < 3 ? 'losing' : 'winning' }));

  const fam = ['sweep', 'unicorn', 'OB'].map(f => { const ts = trades.filter(t => t.family === f), s2 = statsOf(ts); return { f, s: s2 }; });
  const plural = n => `${n} trade${n === 1 ? '' : 's'}`;

/* ---------- journal ---------- */
function inline(text) {
  const out = [], re = /(\*\*[^*]+\*\*|`[^`]+`|_[^_]+_)/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) out.push(document.createTextNode(text.slice(last, m.index)));
    const tok = m[0];
    out.push(tok.startsWith('**') ? h('strong', { text: tok.slice(2, -2) }) : tok.startsWith('`') ? h('code', { text: tok.slice(1, -1) }) : h('em', { text: tok.slice(1, -1) }));
    last = m.index + tok.length;
  }
  if (last < text.length) out.push(document.createTextNode(text.slice(last)));
  return out;
}
function markdown(md) {
  const root = h('div', { class: 'md' }), lines = md.split('\n');
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    if (line.startsWith('|')) {
      const rows = [];
      while (i < lines.length && lines[i].startsWith('|')) { rows.push(lines[i]); i++; }
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(x => x.trim());
      const body = rows.slice(2).map(r => ({ cells: cells(r).map(c => h('span', null, inline(c))) }));
      root.append(h('div', { class: 'tw' }, table(cells(rows[0]), body)));
      continue;
    }
    const hm = line.match(/^(#{1,4})\s+(.*)$/);
    if (hm) { root.append(h(['h2', 'h2', 'h3', 'h4'][hm[1].length - 1], null, inline(hm[2]))); i++; continue; }
    if (/^(- |\d+\. )/.test(line)) {
      const ordered = /^\d+\. /.test(line), list = h(ordered ? 'ol' : 'ul');
      while (i < lines.length && /^(- |\d+\. )/.test(lines[i])) { list.append(h('li', null, inline(lines[i].replace(/^(- |\d+\. )/, '')))); i++; }
      root.append(list); continue;
    }
    root.append(h('p', null, inline(line.replace(/\s+$/, '')))); i++;
  }
  return root;
}
function viewJournal() {
  const j = S.journal || { days: [], entries: {} }, g = h('div', { class: 'grid' });
  const days = j.days.filter(d => j.entries[d]);
  if (!UI.day || !j.entries[UI.day]) UI.day = days[0];
  const left = h('section', { class: 'card s8' });

  left.append(h('div', { class: 'card-h' }, h('div', { class: 'card-t', text: 'Journal' }), h('div', { class: 'card-s', text: 'journal/YYYY-MM-DD.md · one per market day, even with zero trades' })), sel,
    UI.day ? markdown(j.entries[UI.day]) : h('div', { class: 'empty', text: 'No journal yet — it is written after the first job runs.' }));
  g.append(left);
  const right = h('section', { class: 'card s4' }, h('div', { class: 'card-h' }, h('div', { class: 'card-t', text: 'Event log' }), h('div', { class: 'card-s', text: 'state/events.jsonl' })),
    h('div', { class: 'scroll', style: 'max-height:720px' }, feed(S.events.slice().reverse())));
  if ((S.outbox || []).length) right.append(h('div', { class: 'card-t', style: 'margin-top:14px', text: 'Notifications (outbox)' }), h('ul', { class: 'feed' }, S.outbox.map(o => h('li', null, h('span'), h('span', { class: 'ic', text: '✉' }), h('span', { class: 'ink2', text: o.replace(/\.html$/, '') })))));
  g.append(right);

const THEMES = ['auto', 'light', 'dark'];
